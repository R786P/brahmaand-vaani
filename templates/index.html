<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🕉️ Divine AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/vconsole@latest/dist/vconsole.min.js"></script>
  
  <style>
    :root { --primary: #ffd700; --dark: #0a0a1a; --glass: rgba(20, 20, 40, 0.85); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Rajdhani', sans-serif; background: var(--dark); color: #fff; overflow-x: hidden; }
    
    header { text-align: center; padding: 15px; background: rgba(255,215,0,0.1); }
    header h1 { color: var(--primary); font-size: 1.6rem; }
    
    .god-chips { display: flex; gap: 8px; padding: 10px; overflow-x: auto; }
    .god-chip { padding: 8px 16px; background: rgba(100,200,255,0.2); border: 1px solid rgba(100,200,255,0.3); border-radius: 20px; cursor: pointer; white-space: nowrap; }
    .god-chip.active { background: rgba(255,215,0,0.3); border-color: var(--primary); }
    
    #god-stage { display: flex; justify-content: center; align-items: center; min-height: 300px; padding: 20px; }
    #hologram-god { position: relative; width: 200px; height: 280px; display: none; border-radius: 16px; overflow: hidden; box-shadow: 0 0 30px rgba(255,215,0,0.5); }
    #hologram-god.visible { display: block; animation: appear 0.5s ease; }
    @keyframes appear { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    
    #god-image { width: 100%; height: 100%; object-fit: contain; background: rgba(0,0,0,0.5); }
    #god-video { display: none; width: 100%; height: 100%; object-fit: contain; }
    
    #control-panel { padding: 20px; margin: 10px; background: var(--glass); border-radius: 20px; }
    #user-query { width: 100%; min-height: 60px; padding: 12px; border-radius: 12px; border: 2px solid rgba(100,200,255,0.3); background: rgba(15,15,35,0.9); color: white; font-size: 1rem; margin-bottom: 10px; }
    .btn { padding: 12px 20px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 8px; }
    #send-btn { background: linear-gradient(135deg, #4ecdc4, #44a08d); color: white; }
    #send-btn:disabled { opacity: 0.6; }
    #voice-btn { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: white; }
    
    #response-area { margin-top: 15px; padding: 15px; background: rgba(30,30,60,0.7); border-radius: 12px; display: none; }
    #response-area.show { display: block; }
    #god-response { line-height: 1.6; margin-bottom: 10px; }
    
    #reaction-bubble { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #ffd700, #ff6b6b); color: #1a1a3a; padding: 10px 20px; border-radius: 25px; font-weight: 600; display: none; z-index: 1000; }
    #reaction-bubble.show { display: block; animation: pop 0.3s ease; }
    @keyframes pop { from { transform: translateX(-50%) scale(0.5); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
    
    footer { text-align: center; padding: 15px; color: #666; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1><i class="fas fa-om"></i> Divine AI</h1>
    <p>TV Serial Style Hologram Gods ✨</p>
  </header>
  
  <div class="god-chips">
    <div class="god-chip active" data-god="cosmic">🌌 Cosmic</div>
    <div class="god-chip" data-god="shiva">🕉️ Shiva</div>
    <div class="god-chip" data-god="krishna">🦚 Krishna</div>
    <div class="god-chip" data-god="vishnu">🪷 Vishnu</div>
    <div class="god-chip" data-god="durga">🦁 Durga</div>
    <div class="god-chip" data-god="ganesh">🐘 Ganesh</div>
  </div>
  
  <div id="god-stage">
    <div id="hologram-god">
      <img id="god-image" src="" alt="God" />
      <video id="god-video" playsinline></video>
    </div>
  </div>
  
  <div id="reaction-bubble">🙏</div>

  <div id="control-panel">
    <textarea id="user-query" placeholder="🙏 Apna prashn likhiye..."></textarea>
    <button id="voice-btn" class="btn"><i class="fas fa-microphone"></i> Sunna</button>
    <button id="send-btn" class="btn"><i class="fas fa-paper-plane"></i> Bhejiye</button>
    
    <div id="response-area">
      <div id="god-response"></div>
    </div>
  </div>
  
  <footer>Divine AI © 2024 | Radhe Radhe 🦚</footer>

  <script>
    // Initialize vConsole
    var vConsole = new VConsole();
    console.log("✅ Divine AI Loaded!");
    
    // God Configuration
    const GODS = {
      cosmic: { name: 'Cosmic Guide', image: '/assets/gods/cosmic.png', voice: '21m00Tcm4TlvDq8ikWAM' },
      shiva: { name: 'Lord Shiva', image: '/assets/gods/shiva.png', voice: 'pNInz6obpgDQGcFmaJgB' },
      krishna: { name: 'Shri Krishna', image: '/assets/gods/krishna.png', voice: 'TxGEqnHWrfWFTfGW9XjX' },
      vishnu: { name: 'Lord Vishnu', image: '/assets/gods/vishnu.png', voice: 'AZnzlk1XvdvUeBnXmlld' },
      durga: { name: 'Maa Durga', image: '/assets/gods/durga.png', voice: 'EXAVITQu4vr4xnSDxMaL' },
      ganesh: { name: 'Lord Ganesh', image: '/assets/gods/ganesh.png', voice: 'MF3mGyEYCl7XYWbV9V6O' }
    };
    
    let currentGod = 'cosmic';
    
    // DOM Elements - NULL CHECKS KE SAATH
    const hologramGod = document.getElementById('hologram-god');
    const godImage = document.getElementById('god-image');
    const godVideo = document.getElementById('god-video');
    const reactionBubble = document.getElementById('reaction-bubble');
    const sendBtn = document.getElementById('send-btn');
    const voiceBtn = document.getElementById('voice-btn');
    const userQuery = document.getElementById('user-query');
    const responseArea = document.getElementById('response-area');
    const godResponse = document.getElementById('god-response');
    
    // Show Reaction - SAFE VERSION
    function showReaction(text) {
      if (reactionBubble) {
        reactionBubble.textContent = text;
        reactionBubble.classList.add('show');
        setTimeout(() => {
          if (reactionBubble) reactionBubble.classList.remove('show');
        }, 3000);
      }
    }
    
    // Select God - FIXED VERSION
    function selectGod(godKey) {
      if (!GODS[godKey]) {
        console.error("❌ God not found:", godKey);
        godKey = 'cosmic';
      }
      
      currentGod = godKey;
      const god = GODS[godKey];
      
      // Update chips - SAFE
      const chips = document.querySelectorAll('.god-chip');
      if (chips) {
        chips.forEach(chip => chip.classList.remove('active'));
      }
      
      const activeChip = document.querySelector(`[data-god="${godKey}"]`);
      if (activeChip) {
        activeChip.classList.add('active');
      }
      
      // Show hologram - SAFE
      if (godImage && hologramGod) {
        godImage.src = god.image;
        godImage.style.display = 'block';
        if (godVideo) godVideo.style.display = 'none';
        hologramGod.classList.add('visible');
        console.log(`✅ Showing ${god.name}`);
      } else {
        console.error("❌ Hologram elements not found!");
      }
      
      showReaction(`🙏 ${god.name}`);
    }
    
    // God Chip Click - SAFE
    document.querySelectorAll('.god-chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        const godKey = e.currentTarget.dataset.god;
        if (godKey) selectGod(godKey);
      });
    });
    
    // Send Message - WITH ERROR HANDLING
    if (sendBtn) {
      sendBtn.addEventListener('click', async () => {
        const query = userQuery ? userQuery.value.trim() : '';
        if (!query) {
          showReaction('⚠️ Pehle prashn likhiye');
          return;
        }
        
        showReaction('✨ Bhej rahe...');
        if (responseArea) responseArea.classList.add('show');
        if (godResponse) godResponse.innerHTML = '<em>Divine wisdom aa rahi hai...</em>';
        if (sendBtn) sendBtn.disabled = true;
        
        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: query,
              system_prompt: `You are ${GODS[currentGod].name}. Answer in Hindi with divine wisdom.`
            })
          });
          
          if (!response.ok) {
            throw new Error(`Server error: ${response.status}`);
          }
          
          const data = await response.json();
          if (godResponse) {
            godResponse.textContent = data.reply || "Kuch gadbad ho gayi";
          }
          showReaction('🔊 Bol rahe hain...');
          
        } catch (error) {
          console.error("Error:", error);
          if (godResponse) {
            godResponse.textContent = `⚠️ Error: ${error.message}. API key check karein.`;
          }
          showReaction('⚠️ Server Error');
        } finally {
          if (sendBtn) sendBtn.disabled = false;
          if (userQuery) userQuery.value = '';
        }
      });
    }
    
    // Voice Button
    if (voiceBtn) {
      voiceBtn.addEventListener('click', () => {
        showReaction('🎤 Sun raha hoon...');
      });
    }
    
    // Auto-load first god
    window.addEventListener('DOMContentLoaded', () => {
      console.log("🚀 Page loaded, initializing...");
      selectGod('cosmic');
      console.log("✅ Hologram visible!");
    });
  </script>
</body>
</html>
